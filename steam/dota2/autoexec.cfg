// ============================================================
// DOTA 2 AUTOEXEC
// FPS / NETWORK / PERFORMANCE
// ============================================================

fps_max 101
fps_max_ui 30
engine_no_focus_sleep 30

rate 786432
cl_interp_ratio 1

// ============================================================
// GRAPHICS - ADVANCED SETTINGS
// ============================================================

// --- ON ---

// World Lighting
r_deferred_simple_light 1

// Anti-Aliasing
r_dota_fxaa 1

// DirectX 11:
r_dota_bloom_compute_shader 1

// ============================================================
// GRAPHICS - ADVANCED SETTINGS
// OFF
// ============================================================

// Animate Portrait
dota_portrait_animate 0

// Additive Light Pass
r_deferred_additive_pass 0

// Ambient Occlusion
r_ssao 0

// Normal Maps
r_dota_normal_maps 0

// Ground Parallax
r_dota_allow_parallax_mapping 0

// Ambient Creatures
dota_ambient_creatures 0

// Ambient Cloth Simulation
dota_ambient_cloth 0

// Grass
r_grass_quality 0

// Specular
r_deferred_specular 0

// Specular and Light Blooms
r_deferred_specular_bloom 0

// High Quality Water
dota_cheap_water 1

// Atmospheric Fog / Caustics
r_deferred_height_fog 0

// High Quality Dashboard
r_dashboard_render_quality 0

// Tree Wind
r_dota_allow_wind_on_trees 0


// ============================================================
// QUALITY
// ============================================================

// Texture Quality: HIGH
// 0 = High, 1 = Medium, 2 = Low
r_texture_stream_mip_bias 0

// Texture filtering.
// 3 = Anisotropic 4x
r_texturefilteringquality 3

// Effects Quality: LOW
cl_particle_fallback_base 4
cl_particle_fallback_multiplier 1

// Shadow Quality: OFF
cl_globallight_shadow_mode 0

// Game Screen Render Quality: 100%
mat_viewportscale 1.0


// ============================================================
// OTHER PERFORMANCE TWEAKS
// ============================================================

dota_cheap_water 1
dota_hud_reduced_flash 1
dota_disable_particle_lights 1
dota_health_hurt_threshold 99999

cl_particle_fallback_base 4
cl_particle_fallback_multiplier 1

r_depth_of_field 0

r_particle_max_detail_level 0

panorama_allow_transitions 0

echo "DOTA 2 AUTOEXEC LOADED"
